name: Codex Hub release

on:
  push:
    branches: [main]
    paths:
      - 'codex-assistant/**'
      - '.github/workflows/codex-assistant-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    concurrency: codex-assistant-release
    defaults:
      run:
        working-directory: codex-assistant
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: codex-assistant/package-lock.json

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          $release = gh release view $tag --json isDraft 2>$null
          $published = ($LASTEXITCODE -eq 0) -and -not ($release | ConvertFrom-Json).isDraft
          "publish=$((-not $published).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: npm ci

      - name: Build Windows assets
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          REQUIRE_WINDOWS_SIGNATURE: ${{ vars.REQUIRE_WINDOWS_SIGNATURE }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ([bool]$env:WIN_CSC_LINK -ne [bool]$env:WIN_CSC_KEY_PASSWORD) {
            throw 'Set both Windows signing secrets'
          }
          if ($env:REQUIRE_WINDOWS_SIGNATURE -eq 'true' -and !$env:WIN_CSC_LINK) {
            throw 'Windows signing is required but the signing secrets are missing'
          }
          npm run dist
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }

          if ($env:WIN_CSC_LINK) {
            $version = $env:RELEASE_TAG.Substring(1)
            $executables = @(
              'dist/win-unpacked/Codex Hub.exe'
              "dist/Codex-Hub-Setup-$version.exe"
              "dist/Codex-Hub-$version-portable.exe"
            )
            foreach ($exe in $executables) {
              $signature = Get-AuthenticodeSignature -LiteralPath $exe
              if ($signature.Status -ne 'Valid') { throw "Invalid Windows signature: $exe ($($signature.Status))" }
            }
          }

      - name: Verify upgrades from 1.2.1
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: ./build/verify-upgrade.ps1 -Version ($env:RELEASE_TAG.Substring(1))

      - name: Publish verified assets
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          $version = $tag.Substring(1)
          $files = @(
            "dist/Codex-Hub-Setup-$version.exe"
            "dist/Codex-Hub-Setup-$version.exe.blockmap"
            "dist/Codex-Hub-$version-portable.exe"
            "dist/latest.yml"
          )
          foreach ($file in $files) {
            if (!(Test-Path -LiteralPath $file)) { throw "Missing release asset: $file" }
          }
          $installer = [IO.Path]::GetFileName($files[0])
          $hash = [Convert]::ToBase64String([Convert]::FromHexString((Get-FileHash $files[0] -Algorithm SHA512).Hash))
          $metadata = Get-Content 'dist/latest.yml' -Raw
          if (!$metadata.Contains($installer) -or !$metadata.Contains($hash)) {
            throw 'latest.yml does not match the installer'
          }
          gh release view $tag --json isDraft 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --target $env:GITHUB_SHA --title "Codex Hub $version" --notes 'Windows x64. Установка и автоматические обновления через GitHub Releases.'
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release draft' }
          }
          gh release upload $tag @files --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }

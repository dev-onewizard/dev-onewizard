<!DOCTYPE html>
<html lang="ru" data-project="majestic">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Codex Assistant</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-frame">
    <header class="titlebar">
      <div class="brand"><img class="brand-mark" src="../assets/Icon/icon.png" alt=""><span>Codex Assistant</span></div>
      <nav class="segmented main-tabs" aria-label="Разделы">
        <button id="tab-main" class="active" type="button" aria-pressed="true">Проекты</button>
        <button id="tab-settings" type="button" aria-pressed="false">Настройки</button>
      </nav>
      <div class="window-controls">
        <button id="minimize-button" class="icon-button window-control" type="button" aria-label="Свернуть" data-tooltip="Свернуть"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9c.852 0 1.297 .986 .783 1.623l-.076 .084l-6 6a1 1 0 0 1 -1.32 .083l-.094 -.083l-6 -6l-.083 -.094l-.054 -.077l-.054 -.096l-.017 -.036l-.027 -.067l-.032 -.108l-.01 -.053l-.01 -.06l-.004 -.057v-.118l.005 -.058l.009 -.06l.01 -.052l.032 -.108l.027 -.067l.07 -.132l.065 -.09l.073 -.081l.094 -.083l.077 -.054l.096 -.054l.036 -.017l.067 -.027l.108 -.032l.053 -.01l.06 -.01l.057 -.004l12.059 -.002z"/></svg></button>
        <button id="close-button" class="icon-button window-control" type="button" aria-label="Закрыть" data-tooltip="Закрыть"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.707 5.293l5.293 5.292l5.293 -5.292a1 1 0 0 1 1.414 1.414l-5.292 5.293l5.292 5.293a1 1 0 0 1 -1.414 1.414l-5.293 -5.292l-5.293 5.292a1 1 0 1 1 -1.414 -1.414l5.292 -5.293l-5.292 -5.293a1 1 0 0 1 1.414 -1.414"/></svg></button>
      </div>
    </header>

    <section id="startup-screen" class="startup-screen" aria-label="Запуск">
      <div class="startup-content">
        <img src="../assets/Icon/icon.png" class="brand-mark" alt="">
        <h1>Codex Assistant</h1>
        <p role="status"><span class="startup-spinner" aria-hidden="true"></span> Проверяем обновления…</p>
      </div>
    </section>
    <main id="main-content" class="home-view hidden">
      <section class="project-overview" aria-labelledby="home-title">
        <h1 id="home-title">Проекты</h1>
        <div id="project-grid" class="project-grid">
          <button class="project-card" type="button" data-project="majestic" aria-pressed="true">
            <span class="project-art">
              <img class="project-image project-image-muted" src="../assets/projects/majestic-mono.jpg" alt="">
              <img class="project-image project-image-color" src="../assets/projects/majestic.jpg" alt="">
            </span>
            <strong>Majestic RP</strong>
          </button>
          <button class="project-card" type="button" data-project="gta5rp" aria-pressed="false">
            <span class="project-art">
              <img class="project-image project-image-muted" src="../assets/projects/gta5rp-mono.jpg" alt="">
              <img class="project-image project-image-color" src="../assets/projects/gta5rp.jpg" alt="">
            </span>
            <strong>GTA 5 RP</strong>
          </button>
          <button class="project-card" type="button" data-project="russia-online" aria-pressed="false">
            <span class="project-art">
              <img class="project-image project-image-muted" src="../assets/projects/russia-online-mono.jpg" alt="">
              <img class="project-image project-image-color" src="../assets/projects/russia-online.jpg" alt="">
            </span>
            <strong>Россия Онлайн</strong>
          </button>
        </div>
        <div class="project-controls">
          <div class="field">
            <label for="server-selector-button">Сервер</label>
            <div id="server-selector" class="picker">
              <button id="server-selector-button" class="picker-button" type="button" aria-expanded="false" aria-controls="server-dropdown" disabled>
                <span class="server-name"><span id="server-icon" class="server-icon"></span><span id="server-text">Загрузка…</span></span>
                <span class="chevron" aria-hidden="true"></span>
              </button>
              <div id="server-dropdown" class="dropdown hidden"><div id="servers-list"></div></div>
            </div>
          </div>
          <div class="field">
            <label for="hotkey-editor">Горячая клавиша поиска</label>
            <button id="hotkey-editor" class="hotkey-editor" type="button"><kbd id="hotkey-display">Ctrl+Shift+K</kbd></button>
          </div>
        </div>
        <section id="ad-carousel" class="ad-carousel" aria-label="Рекламные баннеры">
          <span id="ad-placeholder">Реклама</span>
          <a id="ad-slide" class="ad-slide" draggable="false" hidden><img id="ad-image" draggable="false" alt=""></a>
          <div id="ad-pagination" class="ad-pagination" role="group" aria-label="Выбор баннера" hidden></div>
        </section>
        <nav class="quick-links" aria-label="Ссылки">
          <a id="link-telegram" href="https://t.me/one1_wizard" class="icon-button link-icon" aria-label="Telegram" data-tooltip="Telegram"><span class="social-mark social-telegram" aria-hidden="true"></span></a>
          <div id="links-dropdown" class="links-dropdown hidden">
            <a id="link-github" href="https://github.com/dev-onewizard/dev-onewizard/tree/main/codex-assistant" class="icon-button link-icon" aria-label="GitHub" data-tooltip="GitHub"><span class="social-mark social-github" aria-hidden="true"></span></a>
            <a id="link-vk" href="https://vk.com/wizard_dev" class="icon-button link-icon" aria-label="ВКонтакте" data-tooltip="ВКонтакте"><span class="social-mark social-vk" aria-hidden="true"></span></a>
            <a id="donate" href="https://www.donationalerts.com/r/wizard_dev" class="icon-button link-icon" aria-label="Поддержать проект" data-tooltip="Поддержать проект"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></a>
          </div>
          <button id="links-button" class="icon-button" type="button" aria-label="Ещё ссылки" aria-expanded="false" aria-controls="links-dropdown" data-tooltip="Ещё">
            <span class="more-links-icon" aria-hidden="true"></span>
          </button>
        </nav>
      </section>
      <aside class="home-sidebar" aria-labelledby="history-title">
        <h2 id="history-title">Что нового</h2>
        <div id="updates-list" class="updates-list"></div>
      </aside>
    </main>

    <main id="settings-content" class="settings-view hidden">
      <div class="settings-heading"><h1>Настройки</h1><span class="version-label">Версия <span id="settings-current-version">—</span></span></div>
      <div class="settings-stack">
        <section class="settings-card">
          <h2>Окно поиска</h2>
          <div class="settings-card-content">
            <div class="setting-row"><span id="theme-label">Цветовая тема</span>
              <div class="theme-options" role="group" aria-labelledby="theme-label">
                <button class="theme-swatch" type="button" data-set-theme="dark" aria-label="Тёмная тема" aria-pressed="true" data-tooltip="Тёмная тема"></button>
                <button class="theme-swatch" type="button" data-set-theme="light" aria-label="Светлая тема" aria-pressed="false" data-tooltip="Светлая тема"></button>
              </div>
            </div>
            <div class="setting-row"><label for="settings-opacity-slider">Прозрачность поиска</label>
              <div class="range-control"><input id="settings-opacity-slider" type="range" min="0" max="25" value="0"><output id="settings-opacity-value" for="settings-opacity-slider">0%</output></div>
            </div>
            <div class="setting-row"><label for="settings-auto-hide">Автоскрытие поиска</label><input id="settings-auto-hide" class="switch" type="checkbox" role="switch"></div>
          </div>
        </section>

        <section class="settings-card">
          <h2>Звук</h2>
          <div class="settings-card-content">
            <div class="setting-row"><label for="settings-sound-enabled">Звуковые эффекты</label><input id="settings-sound-enabled" class="switch" type="checkbox" role="switch" checked></div>
            <div class="setting-row"><label for="settings-volume-slider">Громкость</label>
              <div class="range-control"><input id="settings-volume-slider" type="range" min="0" max="100" value="70"><output id="settings-volume-value" for="settings-volume-slider">70%</output></div>
            </div>
            <div class="setting-actions"><button class="button accent sound-preview-btn" type="button" data-sound="select">Проверить звук</button></div>
          </div>
        </section>

        <section class="settings-card">
          <h2>Обновления</h2>
          <div class="settings-card-content">
            <div id="settings-auto-update-row" class="setting-row"><label id="settings-auto-update-label" for="settings-auto-update">Загружать обновления автоматически</label><input id="settings-auto-update" class="switch" type="checkbox" role="switch" checked></div>
            <p id="settings-update-mode" class="setting-hint"></p>
            <div class="setting-actions"><button id="settings-check-updates" class="button accent" type="button">Проверить обновления</button></div>
            <div id="settings-update-info" class="update-status hidden">
              <p id="settings-update-message" role="status"></p>
              <progress id="settings-update-progress" class="hidden" aria-label="Загрузка обновления" max="100"></progress>
              <button id="settings-install-update" class="button primary hidden" type="button">Установить обновление</button>
              <a id="settings-update-release" class="external-link hidden" href="https://github.com/dev-onewizard/dev-onewizard/releases/latest">Скачать обновление</a>
            </div>
          </div>
        </section>

        <section class="settings-card">
          <h2>Хранилище</h2>
          <div class="settings-card-content">
            <div class="setting-row"><span>Размер кэша</span><output id="settings-cache-size">0 Б</output></div>
            <div class="setting-actions">
              <button id="settings-clear-cache" class="button accent" type="button">Очистить кэш</button>
              <button id="settings-reset-all" class="button accent" type="button">Сбросить настройки</button>
            </div>
          </div>
        </section>
      </div>

    </main>
    <div id="app-toast" class="app-toast" role="status"><span class="toast-icon" aria-hidden="true"></span><span id="app-toast-text"></span></div>
  </div>

  <dialog id="update-modal" class="app-dialog" aria-labelledby="update-title" aria-describedby="update-message">
    <section class="modal-content">
      <h2 id="update-title">Обновить до версии <span id="update-version"></span>?</h2>
      <p id="update-message">Приложение перезапустится после установки.</p>
      <div class="modal-actions">
        <button id="update-install-later" class="button" type="button" autofocus>Отмена</button>
        <button id="update-install-now" class="button primary" type="button">Обновить</button>
      </div>
    </section>
  </dialog>

  <dialog id="confirm-modal" class="app-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <section class="modal-content">
      <h2 id="confirm-title"></h2>
      <p id="confirm-message"></p>
      <div class="modal-actions">
        <button id="confirm-no" class="button" type="button" autofocus>Отмена</button>
        <button id="confirm-yes" class="button primary" type="button">Подтвердить</button>
      </div>
    </section>
  </dialog>

  <script src="js/app-core.js"></script>
  <script src="js/sound-manager.js"></script>
  <script src="js/settings-manager.js"></script>
  <script src="js/ad-carousel.js"></script>
  <script src="js/main-window.js"></script>
</body>
</html>

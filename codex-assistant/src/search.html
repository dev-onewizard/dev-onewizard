<!DOCTYPE html>
<html lang="ru" class="overlay" data-project="majestic">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Codex Assistant — Поиск</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-frame search-frame">
    <header class="titlebar search-titlebar">
      <div class="brand"><img class="brand-mark" src="../assets/Icon/icon.png" alt=""><span>Majestic RP</span></div>
      <button id="hide-search" class="icon-button window-control" type="button" aria-label="Скрыть поиск" title="Скрыть поиск">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </header>

    <main class="search-view">
      <div class="search-toolbar">
        <div class="search-field">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4"/></svg>
          <input id="search-input" type="search" aria-label="Поиск по справочнику" placeholder="Поиск по законам" autocomplete="off" autofocus>
          <button id="clear-search" class="icon-button clear-search hidden" type="button" aria-label="Очистить запрос" title="Очистить запрос">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
          </button>
        </div>
        <nav class="segmented search-tabs" aria-label="База поиска">
          <button id="tab-laws" class="active" type="button" aria-pressed="true">Законы</button>
          <button id="tab-rules" type="button" aria-pressed="false">Правила</button>
        </nav>
      </div>

      <div class="search-filters">
        <div id="laws-filters" class="filters-group" aria-label="Разделы законов"></div>
        <div id="rules-filters" class="filters-group hidden" aria-label="Категории правил">
          <button class="filter-button active" type="button" data-cat="all">Все</button>
          <button class="filter-button" type="button" data-cat="general">Основные</button>
          <button class="filter-button" type="button" data-cat="events">События</button>
          <button class="filter-button" type="button" data-cat="organizations">Организации</button>
          <div id="subcategory-selector" class="picker hidden">
            <button id="subcategory-button" class="picker-button" type="button" aria-expanded="false" aria-controls="subcategory-dropdown"><span id="subcategory-text">Показать все</span><span class="chevron" aria-hidden="true"></span></button>
            <div id="subcategory-dropdown" class="dropdown hidden">
              <button id="subcategory-all" class="subcategory-item active" type="button">Показать все</button>
              <div id="subcategories-list"></div>
            </div>
          </div>
        </div>
        <div id="search-server-selector" class="picker search-server">
          <button id="search-server-button" class="picker-button" type="button" aria-expanded="false" aria-controls="search-server-dropdown" disabled>
            <span class="server-name"><span id="search-server-icon" class="server-icon"></span><span id="search-server-text">Загрузка…</span></span>
            <span class="chevron" aria-hidden="true"></span>
          </button>
          <div id="search-server-dropdown" class="dropdown hidden"><div id="search-servers-list"></div></div>
        </div>
      </div>

      <div class="results-heading"><h1>Результаты</h1><span id="result-count" role="status"></span></div>
      <section id="results-container" class="results-container" aria-label="Результаты поиска">
        <div class="loading-message" role="status">Загрузка данных…</div>
      </section>
    </main>

    <footer class="search-footer">
      <label class="auto-hide-label"><input type="checkbox" id="auto-hide-checkbox" class="switch" role="switch" checked> Автоскрытие</label>
      <a id="rules-source" class="external-link hidden" href="https://github.com/dev-onewizard/majestic-laws-db/tree/main/rules">Источник правил</a>
      <div class="range-control"><label for="opacity-slider">Прозрачность</label>
        <input id="opacity-slider" type="range" min="0" max="25" value="0"><output id="opacity-value" for="opacity-slider">0%</output>
      </div>
    </footer>
  </div>

  <script src="js/app-core.js"></script>
  <script src="js/sound-manager.js"></script>
  <script src="js/search-window.js"></script>
</body>
</html>

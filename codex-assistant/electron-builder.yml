appId: com.onewizard.codex-assistant
productName: Codex Hub
copyright: Copyright © 2026 onewizard-dev

directories:
  output: dist
  buildResources: build

files:
  - main.js
  - preload.js
  - src/**/*
  - assets/**/*
  - package.json
  - releases.json
  - '!**/*.map'
  - '!**/*.test.js'
  - '!**/test/**'

win:
  electronLanguages: [ru, en-US]
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: assets/Icon/windows.ico
  requestedExecutionLevel: asInvoker
  artifactName: ${productName}-${version}-win.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Codex Hub
  deleteAppDataOnUninstall: false
  language: 1049
  license: LICENSE
  include: build/installer.nsh
  installerIcon: build/windows/setup.ico
  uninstallerIcon: assets/Icon/windows.ico
  installerHeader: build/windows/header.bmp
  installerSidebar: build/windows/welcome.bmp
  artifactName: Codex-Hub-Setup-${version}.${ext}

portable:
  artifactName: Codex-Hub-${version}-portable.exe
  requestExecutionLevel: user

publish:
  - provider: github
    owner: dev-onewizard
    repo: dev-onewizard
    releaseType: release

compression: maximum
removePackageScripts: true
removePackageKeywords: true
asar: true
asarUnpack:
  - '**/*.node'
  - '**/build/**/*'
